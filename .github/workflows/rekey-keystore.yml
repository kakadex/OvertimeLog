name: rekey-keystore

# 一次性临时工作流：把仓库 secrets 里的正式 keystore 换成一个「本地知道的新口令」。
#
# 背景：重装系统后本地 keystore 文件还在，但 signing.properties 与口令丢了。
# 签名指纹不能换（换了对老用户就是新应用，无法覆盖升级），所以只能：
#   用 secrets 里的旧口令打开 keystore → 用新口令重设 → 作为 artifact 传回来。
#
# 用法跑完就删掉本文件，不要留在仓库里。
# 新口令通过 workflow_dispatch 输入，不写死在本文件、不落在 git 历史里。

on:
  workflow_dispatch:
    inputs:
      new_password:
        description: 'keystore 新口令（跑完请删除本工作流）'
        required: true

permissions:
  contents: read

jobs:
  rekey:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OLD_STORE: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > keystore.p12
          echo "keystore 字节数: $(stat -c%s keystore.p12)"
          file keystore.p12 || true
          echo "$OLD_STORE" > old.txt

      - name: Verify old password works
        run: |
          set -e
          OLD=$(cat old.txt)
          keytool -list -keystore keystore.p12 -storepass "$OLD" -storetype PKCS12 | head -20

      - name: Rekey to the new password
        env:
          NEW_PASS: ${{ inputs.new_password }}
        run: |
          set -e
          OLD=$(cat old.txt)
          rm -f old.txt
          # PKCS12 下 store 与 key 口令一致，storepasswd 一次即可
          keytool -storepasswd -keystore keystore.p12 -storetype PKCS12 \
            -storepass "$OLD" -new "$NEW_PASS"
          echo "--- 用新口令验证 ---"
          keytool -list -keystore keystore.p12 -storepass "$NEW_PASS" -storetype PKCS12 | head -20
          echo "--- 证书指纹（必须与已发布版本一致）---"
          keytool -list -v -keystore keystore.p12 -storepass "$NEW_PASS" -storetype PKCS12 \
            | grep -E "Alias name|SHA256:" | head -6
          rm -f keystore.p12.old

      - name: Upload rekeyed keystore
        uses: actions/upload-artifact@v4
        with:
          name: overtimelog-keystore-newpass
          path: keystore.p12
          retention-days: 1
