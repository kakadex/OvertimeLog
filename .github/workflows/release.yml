name: release

# 手动触发：Actions → release → Run workflow
#   tag     ：要发布的 tag，必须等于 v<VERSION>
#   publish ：勾选才会创建/更新 GitHub Release；不勾只构建并归档产物（演练用）
#
# 需要的 repository secrets：
#   ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD / ANDROID_KEY_PASSWORD
# 没配签名 secrets 时直接失败，不会产出 debug 签名的包。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.0.0，必须与 VERSION 一致）'
        required: true
      publish:
        description: '勾选后创建/更新 Release（不勾只构建并上传 artifact）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 发行包默认指向腾讯云镜像（本地很快），GitHub runner 在海外偶尔很慢甚至超时；
      # 这里显式把发行包换成官方源，并缓存依赖，避免下载环节把整个 job 拖挂。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper
          # 不走 Daemon 常驻，CI 单次构建更省内存
          arguments: --no-daemon

      - name: Use official Gradle distribution on CI
        run: |
          set -e
          P=gradle/wrapper/gradle-wrapper.properties
          if grep -q 'mirrors.cloud.tencent.com' "$P"; then
            sed -i 's#https\\://mirrors.cloud.tencent.com/gradle/#https\\://services.gradle.org/distributions/#g' "$P"
          fi
          grep distributionUrl "$P"

      - name: Verify tag matches VERSION
        run: |
          set -e
          VERSION=$(cat VERSION)
          if [ "v$VERSION" != "${{ inputs.tag }}" ]; then
            echo "::error::tag 与 VERSION 不一致：输入 ${{ inputs.tag }}，VERSION $VERSION"
            exit 1
          fi
          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/${{ inputs.tag }}" >/dev/null || { echo "::error::仓库不存在该 tag"; exit 1; }

      - name: Ensure Android SDK 37
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          # compileSdk = 37 在 sdkmanager 里的包名是 platforms;android-37.0（不是 android-37），
          # 目录同样是 platforms/android-37.0。旧脚本判断 android-37 永远为假，又装错了包名。
          if [ -d "$SDK/platforms/android-37.0" ] || [ -d "$SDK/platforms/android-37" ]; then
            echo "SDK 37 已存在"
          else
            if command -v sdkmanager >/dev/null 2>&1; then
              yes | sdkmanager --licenses >/dev/null 2>&1 || true
              yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" >/dev/null || true
            else
              echo "::error::找不到 sdkmanager，无法安装 platforms;android-37.0"
              exit 1
            fi
          fi
          ls "$SDK/platforms"
          ls "$SDK/build-tools" || true

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，拒绝用 debug 签名发布"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=overtimelog"
            echo "keyPassword=$KEY_PASS"
          } > signing.properties

      - name: Tests
        run: |
          # gradlew 在仓库里的权限位是 644（Windows 上提交的），CI 上必须显式加执行权限
          chmod +x gradlew
          # 注意：core:model 也有单测（日历放假判定），漏掉它等于少跑一半逻辑
          ./gradlew :app:testDebugUnitTest :core:calculation:test :core:model:test --console=plain

      - name: Build release (R8 + ABI splits + AAB)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease -PabiSplits=true --console=plain

      - name: Stage artifacts with release naming
        run: |
          set -e
          VERSION=$(cat VERSION)
          TAG="${{ inputs.tag }}"
          REPO="${{ github.repository }}"
          mkdir -p out
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')
            cp "$f" "out/OvertimeLog-$VERSION-android-$abi.apk"
          done
          cp "app/build/outputs/bundle/release/app-release.aab" "out/OvertimeLog-$VERSION.aab"

          ARM64="out/OvertimeLog-$VERSION-android-arm64-v8a.apk"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "page=https://github.com/$REPO/releases/tag/$TAG"
            echo "apk=https://github.com/$REPO/releases/download/$TAG/$(basename "$ARM64")"
            echo "size=$(stat -c%s "$ARM64")"
            echo "sha256=$(sha256sum "$ARM64" | cut -d' ' -f1)"
            echo "prefer=github"
          } > out/latest.txt

          cat > out/README.txt <<EOF
          加班记 OvertimeLog v$VERSION 分发包

          版本：$VERSION
          tag：$TAG
          说明：官方发布以 Releases 页面为准。

          安装：Android 8.0（API 26）及以上，允许「未知来源」后安装对应 ABI 的 APK。
          不确定机型就装 android-arm64-v8a；上架应用商店使用 .aab。
          本包使用正式签名，后续版本可直接覆盖升级。
          EOF

          (cd out && sha256sum OvertimeLog-* latest.txt README.txt > SHA256SUMS.txt)
          ls -l out

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: overtimelog-${{ inputs.tag }}
          path: out/*
          retention-days: 14

      - name: Archive R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: overtimelog-mapping-${{ inputs.tag }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Create / update GitHub Release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: 加班记 ${{ inputs.tag }}
          body_path: RELEASE_NOTES.md
          files: out/*
          fail_on_unmatched_files: true
