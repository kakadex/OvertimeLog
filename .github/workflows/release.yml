name: release

# 手动触发：在 Actions 页面点 Run workflow，填入已存在的 tag（例如 v1.0.0）。
# 只做 GitHub Releases；Gitee 用本地 scripts/publish.ps1。
#
# 需要的 repository secrets（见 SECRETS-SETUP.md）：
#   ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD / ANDROID_KEY_PASSWORD
# 没配签名 secrets 时直接失败，不会产出调试签名的包。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在，如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify tag matches VERSION
        run: |
          set -e
          VERSION=$(cat VERSION)
          if [ "v$VERSION" != "${{ inputs.tag }}" ]; then
            echo "::error::tag 与 VERSION 不一致：输入 ${{ inputs.tag }}，VERSION $VERSION"
            exit 1
          fi
          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/${{ inputs.tag }}" >/dev/null || { echo "::error::远程不存在该 tag"; exit 1; }

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，拒绝用 debug 签名发布"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=overtimelog"
            echo "keyPassword=$KEY_PASS"
          } > signing.properties

      - name: Tests
        run: ./gradlew :app:testDebugUnitTest :core:calculation:test --console=plain

      - name: Build release (R8 + ABI splits + AAB)
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PabiSplits=true --console=plain

      - name: Stage artifacts with release naming
        run: |
          set -e
          VERSION=$(cat VERSION)
          mkdir -p out
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')
            cp "$f" "out/OvertimeLog-$VERSION-android-$abi.apk"
          done
          cp "app/build/outputs/bundle/release/app-release.aab" "out/OvertimeLog-$VERSION.aab"
          cp app/build/outputs/mapping/release/mapping.txt "out/OvertimeLog-$VERSION-mapping.txt" || true
          (cd out && sha256sum OvertimeLog-* > SHA256SUMS.txt)
          ls -l out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: 加班记 ${{ inputs.tag }}
          body_path: RELEASE_NOTES.md
          files: out/*
          fail_on_unmatched_files: true
