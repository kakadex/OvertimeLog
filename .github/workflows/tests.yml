name: tests

# 每次推送到 main 或提 PR 自动跑单测，不用手动发版就能发现编译/测试问题。
# 不发版、不需要签名 secrets，跑完只留测试报告。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # 本地 wrapper 指向腾讯云镜像，海外 runner 走官方源更稳
      - name: Use official Gradle distribution on CI
        run: |
          set -e
          P=gradle/wrapper/gradle-wrapper.properties
          if grep -q 'mirrors.cloud.tencent.com' "$P"; then
            sed -i 's#https\\://mirrors.cloud.tencent.com/gradle/#https\\://services.gradle.org/distributions/#g' "$P"
          fi
          grep distributionUrl "$P"

      # compileSdk 37 的包名是 platforms;android-37.0
      - name: Ensure Android SDK 37
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -d "$SDK/platforms/android-37.0" ] || [ -d "$SDK/platforms/android-37" ]; then
            echo "SDK 37 已存在"
          else
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" >/dev/null || true
          fi
          ls "$SDK/platforms"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :core:calculation:test :core:model:test --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            core/*/build/reports/tests/**
          retention-days: 7
