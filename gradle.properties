# JVM 参数：Compose 编译 + Kotlin 增量编译比较吃内存，4G 是这台机器的稳妥值。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 本机 SDK 最高是 37，AGP 9.1.0 官方测试到 36.1；显式确认后压掉黄色警告。
android.suppressUnsupportedCompileSdk=37.0

# AGP 9 的开关：关掉内置 Kotlin 与新 DSL，走经典写法（与本机已验证的 Flutter 工程一致）。
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
